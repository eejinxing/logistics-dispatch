<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EJX Logistics</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="login-page">
  <form class="card login-card" id="login" autocomplete="on">
    <img class="login-brand" src="/ejx-logistics.svg" alt="EJX Logistics" width="174" height="60">
    <h1>Sign in</h1>
    <div class="field">
      <label for="username">Username</label>
      <input class="input" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit" id="submit">Sign in</button>
  </form>
</main>
<script>
  function csrfToken() {
    const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    const btn = document.getElementById('submit');
    err.textContent = '';
    btn.disabled = true;
    try {
      const body = new URLSearchParams({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRF-TOKEN': csrfToken() },
        body,
        credentials: 'same-origin'
      });
      if (res.ok) {
        location.href = '/';
        return;
      }
      let message = 'Sign-in failed';
      try { message = (await res.json()).detail || message; } catch (ignored) { }
      if (res.status === 403) message = 'Your session expired. Refresh the page and try again.';
      err.textContent = message;
    } catch (ex) {
      err.textContent = 'Could not connect to the server.';
    } finally {
      btn.disabled = false;
    }
  });

</script>
</body>
</html>
