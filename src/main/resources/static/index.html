<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EJX Logistics</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/shipments.css">
  <link rel="stylesheet" href="/css/fleet.css">
  <link rel="stylesheet" href="/css/dispatch.css">
  <link rel="stylesheet" href="/css/reports.css">
</head>
<body class="admin-page">
<div class="shell">
  <aside class="sidebar admin-rail">
    <div class="rail-head">
      <button type="button" class="rail-toggle" id="nav-toggle" aria-controls="nav" aria-expanded="false" aria-label="Expand navigation" title="Expand navigation">
        <img class="rail-brand-icon" src="/favicon.svg" alt="" width="30" height="30">
        <span class="rail-label rail-brand-name">EJX Logistics</span>
      </button>
      <img class="rail-brand-mobile" src="/favicon.svg" alt="EJX Logistics" width="30" height="30">
      <button type="button" class="rail-search" id="nav-search" aria-label="Find a page" title="Find a page (Ctrl+K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg><span class="rail-label">Find a page</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Operations navigation">
      <div class="rail-group">
        <span class="rail-group-title">Work</span>
        <a href="#/dashboard" data-route="dashboard" aria-label="Overview" title="Overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span class="rail-label">Overview</span></a>
        <a href="#/shipments" data-route="shipments" aria-label="Shipments" title="Shipments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span class="rail-label">Shipments</span><span class="badge-count hidden" id="nav-exceptions"></span></a>
        <a href="#/dispatch" data-route="dispatch" aria-label="Dispatch" title="Dispatch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h10M4 12h16M4 18h7M17 3l3 3-3 3"/></svg><span class="rail-label">Dispatch</span><span class="badge-count hidden" id="nav-pending"></span></a>
      </div>
      <div class="rail-group">
        <span class="rail-group-title">Network</span>
        <a href="#/fleet" data-route="fleet" aria-label="Fleet" title="Fleet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" stroke-linejoin="round"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg><span class="rail-label">Fleet</span></a>
        <a href="#/hubs" data-route="hubs" aria-label="Hubs" title="Hubs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 1114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="rail-label">Hubs</span></a>
        <a href="#/reports" data-route="reports" aria-label="Reports" title="Reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m6 7H2"/></svg><span class="rail-label">Reports</span></a>
      </div>
    </nav>
    <details class="rail-account">
      <summary aria-label="Account menu" title="Account menu"><span class="rail-avatar" id="rail-avatar" aria-hidden="true">A</span><span class="rail-label">Account</span></summary>
      <div class="rail-account-menu">
        <strong id="me"></strong>
        <div class="rail-live"><span class="live-dot" id="live-dot"></span><span id="live-text">Connecting…</span></div>
        <button class="btn small" id="logout" type="button">Sign out</button>
      </div>
    </details>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Overview</h1>
      <div class="spacer"></div>
      <div class="sim-clock" id="sim-controls">
        <span class="sim-time" title="Simulation clock (Asia/Kuala_Lumpur)">Sim time <b id="sim-now">--</b></span>
        <div class="seg" id="sim-speed" role="group" aria-label="Simulation speed">
          <button data-pause="1" title="Pause" aria-label="Pause">⏸</button>
          <button data-scale="60" title="1 second = 1 minute">1m/s</button>
          <button data-scale="360" title="1 second = 6 minutes">6m/s</button>
          <button data-scale="1800" title="1 second = 30 minutes">30m/s</button>
          <button data-scale="3600" title="1 second = 1 hour">1h/s</button>
        </div>
        <button class="btn small" id="sim-skip" title="Advance the simulation by one hour">Skip +1h</button>
        <label class="toggle"><input type="checkbox" id="sim-autogen">Auto orders</label>
        <label class="toggle"><input type="checkbox" id="sim-autodispatch">Auto dispatch</label>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<dialog class="rail-finder" id="nav-finder" aria-labelledby="finder-title">
  <header><h2 id="finder-title">Find a page</h2><form method="dialog"><button type="submit" aria-label="Close">×</button></form></header>
  <input class="input" id="finder-search" type="search" aria-label="Search pages" placeholder="Search pages" autocomplete="off">
  <nav id="finder-results" aria-label="Matching pages"></nav>
  <p id="finder-empty" hidden>No matching pages.</p>
</dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
