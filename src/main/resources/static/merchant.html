<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merchant portal · Freight Dispatch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9h18v11H3zM9 13h6"/></svg>
      </div>
      <div>
        <div class="brand-name">Merchant portal</div>
        <div class="brand-sub" id="shop-name">-</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Overview</a>
      <a href="#/ship" data-route="ship">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Create shipment</a>
      <a href="#/shipments" data-route="shipments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>My shipments</a>
      <a href="#/profile" data-route="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Business profile</a>
    </nav>
    <div class="sidebar-foot">
      <div>Account <span class="user" id="me">-</span></div>
      <button id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar"><h1 id="page-title">Overview</h1><div class="spacer"></div>
      <span class="sim-time" title="Simulation clock (Asia/Kuala_Lumpur)">Current time <b id="sim-now">--</b></span></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="/js/merchant.js"></script>
</body>
</html>
