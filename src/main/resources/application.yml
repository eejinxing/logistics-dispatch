spring:
  application:
    name: logistics-dispatch
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:mem:logistics;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 24
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

  concurrency:
    io-pool:
      core-size: 8
      max-size: 18
      queue-capacity: 0
      keep-alive: 60s
      shutdown-wait: 15s
    bulkheads:
      dispatch: 4
      dashboard: 12
    hub-lock-timeout: 3s
    dashboard-timeout: 2s

  seed:
    enabled: true
    history-days: 3
    history-shipments: 260
    pending-shipments: 40

  routing:
    gateway: KUL

  simulation:
    enabled: true
    time-scale: 360
    auto-generate: true
    shipments-per-hour: 4
    auto-dispatch: true
    auto-dispatch-every: 30m
    consolidation-wait: 3h
    fill-threshold: 0.6
    loading-time: 40m
    delay-rate: 0.08
    exception-rate: 0.05
