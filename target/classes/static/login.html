<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Freight Dispatch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="login-page">
  <form class="card login-card" id="login" autocomplete="on">
    <div class="brand" style="padding:0">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      </div>
      <div>
        <div class="brand-name" style="color:var(--text)">Freight Dispatch</div>
        <div class="brand-sub">Operations</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <div class="field">
      <label for="username">Username</label>
      <input class="input" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" type="submit" id="submit">Sign in</button>
  </form>
</main>
<script>
  function csrfToken() {
    const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    const btn = document.getElementById('submit');
    err.textContent = '';
    btn.disabled = true;
    try {
      const body = new URLSearchParams({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRF-TOKEN': csrfToken() },
        body,
        credentials: 'same-origin'
      });
      if (res.ok) {
        location.href = '/';
        return;
      }
      let message = 'Sign-in failed';
      try { message = (await res.json()).detail || message; } catch (ignored) { }
      if (res.status === 403) message = 'Your session expired. Refresh the page and try again.';
      err.textContent = message;
    } catch (ex) {
      err.textContent = 'Could not connect to the server.';
    } finally {
      btn.disabled = false;
    }
  });

</script>
</body>
</html>
